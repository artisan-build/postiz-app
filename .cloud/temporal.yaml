# enable-template
log:
  stdout: true
  level: warn
persistence:
  defaultStore: primary
  visibilityStore: visibility
  numHistoryShards: 4
  datastores:
    primary:
      sql:
        pluginName: postgres12
        databaseName: {{ env "TEMPORAL_PG_DATABASE" | quote }}
        connectAddr: {{ printf "%s:%s" (env "TEMPORAL_PG_HOST") (env "TEMPORAL_PG_PORT") | quote }}
        connectProtocol: tcp
        user: {{ env "TEMPORAL_PG_USER" | quote }}
        password: {{ env "TEMPORAL_PG_PASSWORD" | quote }}
        maxConns: 5
        maxIdleConns: 1
        maxConnLifetime: 1h
        tls:
          enabled: {{ env "TEMPORAL_PG_TLS" }}
          enableHostVerification: true
    visibility:
      sql:
        pluginName: postgres12
        databaseName: {{ env "TEMPORAL_PG_VISIBILITY_DATABASE" | quote }}
        connectAddr: {{ printf "%s:%s" (env "TEMPORAL_PG_HOST") (env "TEMPORAL_PG_PORT") | quote }}
        connectProtocol: tcp
        user: {{ env "TEMPORAL_PG_USER" | quote }}
        password: {{ env "TEMPORAL_PG_PASSWORD" | quote }}
        maxConns: 2
        maxIdleConns: 1
        maxConnLifetime: 1h
        tls:
          enabled: {{ env "TEMPORAL_PG_TLS" }}
          enableHostVerification: true
global:
  membership:
    maxJoinDuration: 30s
    broadcastAddress: 127.0.0.1
services:
  frontend:
    rpc:
      grpcPort: 7233
      membershipPort: 6933
      bindOnIP: 127.0.0.1
  history:
    rpc:
      grpcPort: 7234
      membershipPort: 6934
      bindOnIP: 127.0.0.1
  matching:
    rpc:
      grpcPort: 7235
      membershipPort: 6935
      bindOnIP: 127.0.0.1
  worker:
    rpc:
      grpcPort: 7239
      membershipPort: 6939
      bindOnIP: 127.0.0.1
clusterMetadata:
  enableGlobalNamespace: false
  failoverVersionIncrement: 10
  masterClusterName: active
  currentClusterName: active
  clusterInformation:
    active:
      enabled: true
      initialFailoverVersion: 1
      rpcName: frontend
      rpcAddress: 127.0.0.1:7233
dcRedirectionPolicy:
  policy: noop
archival:
  history:
    state: disabled
    enableRead: false
  visibility:
    state: disabled
    enableRead: false
namespaceDefaults:
  archival:
    history:
      state: disabled
    visibility:
      state: disabled
