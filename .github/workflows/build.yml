---
name: CI

on:
  push:
    branches:
      - main
  merge_group:
  pull_request:

jobs:
  gate:
    name: Production build and deployment safeguards
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: pnpm

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test Cloud launcher environment mapping
        run: node --test .cloud/*.test.cjs

      - name: Test authentication cookie scope
        run: node --experimental-strip-types --test libraries/helpers/src/subdomain/subdomain.management.test.mjs

      - name: Lint authentication cookie helper
        env:
          ESLINT_USE_FLAT_CONFIG: 'false'
        run: pnpm exec eslint --no-eslintrc --config .cloud/eslint.helpers.cjs libraries/helpers/src/subdomain/subdomain.management.ts libraries/helpers/src/subdomain/subdomain.management.test.mjs

      - name: Production build
        run: pnpm run build
